spring.application.name=resource-booking-system

# ==========================================
# MySQL Database Configuration
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/resource_booking_db
spring.datasource.username=root
spring.datasource.password=root18
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# JWT Configuration
# ==========================================

app.jwt.secret=ResourceBookingSystemJwtSecretKeyForDevelopmentOnly123456789
app.jwt.expiration=86400000